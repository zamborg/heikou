name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The end-to-end and tmux suites skip themselves when tmux is missing. On a
  # runner that is a failure, not a reason to report green over a suite that
  # never ran.
  HEIKOU_TEST_REQUIRE_TMUX: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Heikou drives tmux and the filesystem directly, and its users are
          # largely on macOS. Linux alone would not have caught a difference in
          # either.
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null 2>&1 || brew install tmux

      - name: Report tmux version
        run: tmux -V

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod or go.sum is out of date; run go mod tidy"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build -trimpath -o "${RUNNER_TEMP}/h" ./cmd/h

  # go install compiles on the user's machine, so a platform that stops building
  # is a broken install for whoever is on it — there is no artifact in between
  # that would have failed first. ubuntu and macOS runners cover linux/amd64 and
  # darwin/arm64 already; these are the two nobody would otherwise compile.
  cross-build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o "${RUNNER_TEMP}/heikou" ./cmd/h

  # A tag can only be checked once it exists, and by then it is public. This
  # runs the same script on every pull request for the parts it can check
  # without one: that the version is semver, and that the README still installs
  # @latest rather than a pin that goes stale on the next release.
  version:
    name: Version agreement
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Check the version and install command
        run: ./scripts/check-version.sh

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Pinned rather than @latest: a new staticcheck release should be a
      # deliberate upgrade with its findings reviewed, not a build that turns
      # red on a morning nobody touched the code.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
